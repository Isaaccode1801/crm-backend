services:
  facilito-backend:
    build: .
    container_name: facilito-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=crm
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.facilito-backend.rule=Host(`api.facilitomais.com`)"
      - "traefik.http.routers.facilito-backend.entrypoints=websecure"
      - "traefik.http.routers.facilito-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.facilito-backend.loadbalancer.server.port=8080"
    networks:
      - facilito-network
      - n8n_default

networks:
  facilito-network:
    driver: bridge
  n8n_default:
    external: true

# Configuração concluída
